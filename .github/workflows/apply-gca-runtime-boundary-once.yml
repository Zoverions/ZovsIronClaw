name: Apply GCA Runtime Boundary Once

on:
  push:
    branches:
      - agent/status-and-scope-2026-08
    paths:
      - ".github/workflows/apply-gca-runtime-boundary-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-gca-runtime-boundary-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/status-and-scope-2026-08
          fetch-depth: 0

      - name: Verify preimages and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object apps/gca-service/api_server.py)" = "f626e5536bc73d2fee304325acde38bef06b185f"
          test "$(git hash-object README.md)" = "daee8cc4390b809959f6e6d8a15ad900da1839a3"

          python - <<'PY'
          from pathlib import Path

          api_path = Path("apps/gca-service/api_server.py")
          api = api_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          api = replace_once(
              api,
              "from fastapi.middleware.cors import CORSMiddleware\n",
              "from fastapi.middleware.cors import CORSMiddleware\nfrom fastapi.responses import JSONResponse\n",
              "JSONResponse import",
          )
          api = replace_once(
              api,
              "from dreamer import DeepDreamer\n",
              "from dreamer import DeepDreamer\nfrom runtime_boundary import api_key_status, configured_api_key, env_flag, side_effect_allowed\n",
              "runtime boundary import",
          )
          api = replace_once(
              api,
              "logger.info(f\"Loaded Profile: {CFG.get('active_profile', 'unknown').upper()}\")\n",
              "logger.info(f\"Loaded Profile: {CFG.get('active_profile', 'unknown').upper()}\")\nEXPERIMENTAL_RUNTIME_ENABLED = env_flag(\"GCA_ENABLE_EXPERIMENTAL_RUNTIME\")\n",
              "experimental runtime flag",
          )
          api = replace_once(
              api,
              "guardrail = SecurityGuardrail(perception_system=perception)\nguardrail = SecurityGuardrail()\n",
              "guardrail = SecurityGuardrail(perception_system=perception)\n",
              "guardrail double initialization",
          )
          api = replace_once(
              api,
              "pulse.set_intervention_callback(pulse_correction)\npulse.start()\n",
              "pulse.set_intervention_callback(pulse_correction)\nif EXPERIMENTAL_RUNTIME_ENABLED:\n    pulse.start()\nelse:\n    logger.warning(\"Experimental Pulse background loop disabled by default. Set GCA_ENABLE_EXPERIMENTAL_RUNTIME=1 only for isolated evaluation.\")\n",
              "pulse startup",
          )

          swarm_start = api.index("# Init Iron Swarm")
          swarm_end = api.index("# Bind Introspection Loop", swarm_start)
          swarm_block = '''# Init Iron Swarm\nswarm_network = SwarmNetwork(glassbox, reflective_logger, moral_kernel, profile=resource_manager.profile, port=8000)\nif security_manager.private_key:\n    swarm_network.mesh.set_security_manager(security_manager)\n\nswarm_network.mesh.set_blockchain(blockchain)\n\nif EXPERIMENTAL_RUNTIME_ENABLED:\n    swarm_network.mesh.start()\n\n    # Experimental registration is network-visible and therefore opt-in.\n    if security_manager.private_key:\n        my_id = swarm_network.mesh.agent_id\n        my_key = security_manager.get_public_key_b64()\n        if not blockchain.verify_identity(my_id, my_key):\n            logger.info(f"Identity {my_id} not on local chain. Broadcasting experimental REGISTER_DEVICE...")\n            reg_tx = Transaction(\n                id=f"reg-{int(time.time())}",\n                type="REGISTER_DEVICE",\n                sender=my_key,\n                recipient="REGISTRY",\n                payload={"agent_id": str(my_id)},\n                timestamp=time.time(),\n            )\n            reg_tx.signature = security_manager.sign_message(reg_tx.calculate_hash())\n            blockchain.add_transaction(reg_tx)\n            swarm_network.mesh.broadcast_transaction(reg_tx)\nelse:\n    logger.warning(\n        "Experimental mesh/governance runtime disabled by default; no mesh listener or registration broadcast was started."\n    )\n\n'''
          api = api[:swarm_start] + swarm_block + api[swarm_end:]

          auth_start = api.index("async def verify_api_key")
          auth_end = api.index("# ============================================================================\n# Endpoints", auth_start)
          auth_block = '''async def verify_api_key(api_key: str = Security(api_key_header)):\n    """Require the configured GCA API key and fail closed when none exists."""\n    expected_key = configured_api_key(CFG)\n    decision = api_key_status(expected_key, api_key)\n    if decision == 200:\n        return api_key\n    if decision == 503:\n        logger.error("GCA_API_KEY not configured. Blocking control endpoint.")\n        raise HTTPException(\n            status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n            detail="GCA control API is disabled until GCA_API_KEY is configured.",\n        )\n    raise HTTPException(\n        status_code=status.HTTP_403_FORBIDDEN,\n        detail="Could not validate credentials",\n    )\n\n\n@app.middleware("http")\nasync def enforce_gca_control_boundary(request: Request, call_next):\n    """Authenticate every /v1 control route and gate network/governance mutations."""\n    path = request.url.path\n    if path.startswith("/v1/"):\n        expected_key = configured_api_key(CFG)\n        decision = api_key_status(expected_key, request.headers.get("X-GCA-API-Key"))\n        if decision != 200:\n            detail = (\n                "GCA control API is disabled until GCA_API_KEY is configured."\n                if decision == 503\n                else "Could not validate credentials"\n            )\n            return JSONResponse(status_code=decision, content={"detail": detail})\n        if not side_effect_allowed(path, EXPERIMENTAL_RUNTIME_ENABLED):\n            return JSONResponse(\n                status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n                content={\n                    "detail": (\n                        "Experimental mesh/governance mutation is disabled. "\n                        "Set GCA_ENABLE_EXPERIMENTAL_RUNTIME=1 only for isolated evaluation."\n                    )\n                },\n            )\n    return await call_next(request)\n\n\n'''
          api = api[:auth_start] + auth_block + api[auth_end:]

          api = replace_once(
              api,
              'return {\n        "status": "healthy",\n',
              'return {\n        "status": "healthy",\n        "experimental_runtime_enabled": EXPERIMENTAL_RUNTIME_ENABLED,\n',
              "health runtime state",
          )
          api = replace_once(
              api,
              "if new_memories:\n            # Fire and forget sync in background (using threadpool for simplicity)\n",
              "if EXPERIMENTAL_RUNTIME_ENABLED and new_memories:\n            # Experimental mesh propagation is explicit opt-in.\n",
              "reason memory broadcast",
          )

          api_path.write_text(api)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              "> **Status:** Experimental fork-derived runtime and gateway. GCA, moral, soul, entropy, and thermodynamic components are policy experiments, not proof of ethical correctness or production safety. The default-branch baseline is not clean, and a revoked credential artifact remains in public history. See [`PORTFOLIO_STATUS.md`](PORTFOLIO_STATUS.md).\n",
              "> **Status:** Experimental fork-derived runtime and gateway. GCA, moral, soul, entropy, and thermodynamic components are policy experiments, not proof of ethical correctness or production safety. The default-branch baseline is not clean, and a revoked credential artifact remains in public history. See [`PORTFOLIO_STATUS.md`](PORTFOLIO_STATUS.md).\n>\n> **Default authority boundary:** every `/v1/*` GCA control route requires `GCA_API_KEY`; Pulse/mesh/governance mutation and memory propagation are disabled unless `GCA_ENABLE_EXPERIMENTAL_RUNTIME=1`; GCA-generated tool calls are not forwarded unless `GCA_ENABLE_EXPERIMENTAL_TOOL_CALLS=1`. Loopback HTTP is allowed for a local sidecar, while non-local GCA transport must use HTTPS. These opt-ins do not make GCA scores or signatures execution authority.\n",
              "README boundary banner",
          )
          replacements = {
              "- **Protects**: Enforces thermodynamic ethics to ensure sustainable growth.": "- **Experiments**: Provides optional entropy/thermodynamic-inspired policy signals for research; they are not objective ethics or execution authority.",
              "│  │ Moral Kernel: Ethics Engine     │   │": "│  │ Moral Kernel: Policy Heuristic │   │",
              "The GCA framework provides transparent, interpretable AI reasoning through geometric vector manipulation in latent space.": "The GCA framework experiments with interpretable steering and policy signals through geometric/vector techniques. Its moral, entropy, soul, and thermodynamic scores are research heuristics, not validated ethical truth.",
              "- **Moral Kernel**: Thermodynamic ethics engine evaluating entropy and reversibility": "- **Moral Kernel**: Experimental entropy/reversibility policy heuristic; not authorization",
              "A proactive cybernetic loop that ensures the agent remains aligned with its goals.": "An experimental proactive loop for studying goal-divergence signals. It is disabled by default and does not establish alignment.",
              "### 3. Iron Swarm: Ethical Agent Orchestration": "### 3. Iron Swarm: Experimental Agent Orchestration",
              "The **Iron Swarm** allows you to assign agents and manage them in a deeply ethical way.": "The **Iron Swarm** is an experimental multi-agent orchestration layer. Mesh/network mutation is disabled by default.",
              "- **Ethical Delegation**: Every task delegation is pre-screened by the `MoralKernel`. Unethical tasks (destruction, exploitation) are rejected *before* they leave the node.": "- **Delegation Screening**: Tasks may be scored by the experimental `MoralKernel`, but that score is advisory and cannot substitute for normal authorization/policy.",
              "- **Altruistic Alignment**: Agents prioritize tasks that generate \"Causal Emergence\" and community value.": "- **Research Objective Signals**: Causal-emergence/community-value metrics are experimental ranking signals, not validated alignment guarantees.",
              "- **Decentralized Conscience**: Each node in the mesh enforces the same thermodynamic laws, creating a trustless ethical substrate.": "- **Mesh Research**: Signed nodes can exchange experimental state when explicitly enabled; signatures and shared heuristics do not create a trustless ethical or authorization substrate.",
              "This prevents \"lazy thinking\" and ensures cognitive stability.": "This is an experimental structuring heuristic; it does not guarantee reasoning quality or cognitive stability.",
              "Continuous adversarial testing to validate safety mechanisms:": "An adversarial-testing research harness for exercising experimental defenses; passing bouts do not validate production safety:",
              "- **Direct CLI Access**: The agent has native, direct control over the terminal via the `bash` tool. It can install packages, manage files, and execute scripts autonomously.": "- **Host Tooling**: OpenClaw may expose terminal/filesystem tools subject to its normal approval, sandbox, and policy boundaries. GCA does not grant additional host authority.",
              "- **Tool Fusion**: Unlike other agents that use fragile \"connectors\", GCA tools are geometrically mapped to intent vectors.": "- **Tool Suggestions**: GCA may rank or suggest tools, but GCA-generated tool calls are not forwarded by default and never carry an authority token.",
              "- **Self-Direction**: The `PulseSystem` allows the agent to proactively \"wake up\" and perform maintenance or research tasks without user prompting.": "- **Pulse Research**: Proactive Pulse behavior is disabled by default and requires explicit isolated-evaluation opt-in.",
              "- **Cryptographic Trust**: All mesh communication is signed with **Ed25519** keys derived from this identity. Only devices sharing the same identity phrase can command each other, preventing unauthorized access in local networks.": "- **Experimental Mesh Identity**: Mesh messages can be signed with Ed25519 identity keys when the experimental runtime is enabled. A signature or shared identity phrase is not by itself sufficient authorization for externally consequential actions.",
          }
          for old, new in replacements.items():
              readme = replace_once(readme, old, new, f"README claim: {old[:32]}")
          readme_path.write_text(readme)
          PY

          git rm .github/workflows/apply-gca-runtime-boundary-once.yml

          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            .github/workflows/apply-gca-runtime-boundary-once.yml
            README.md
            apps/gca-service/api_server.py
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Verify offline authority contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            apps/gca-service/runtime_boundary.py \
            apps/gca-service/api_server.py \
            apps/gca-service/tests/test_runtime_boundary.py
          python -m unittest discover -s apps/gca-service/tests -p 'test_runtime_boundary.py' -v

      - name: Commit only the bounded patch and self-removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md apps/gca-service/api_server.py .github/workflows/apply-gca-runtime-boundary-once.yml
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged.txt"
          printf '%s\n' \
            .github/workflows/apply-gca-runtime-boundary-once.yml \
            README.md \
            apps/gca-service/api_server.py \
            > "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/staged.txt" "$RUNNER_TEMP/expected.txt"
          git commit -m 'security: default-deny experimental GCA authority'
          git push origin HEAD:agent/status-and-scope-2026-08
