name: GCA Runtime Boundary

on:
  pull_request:
    paths:
      - "apps/gca-service/**"
      - "extensions/gca-brain/**"
      - "README.md"
      - "PORTFOLIO_STATUS.md"
      - ".github/workflows/gca-runtime-boundary.yml"
  push:
    branches:
      - main
    paths:
      - "apps/gca-service/**"
      - "extensions/gca-brain/**"
      - "README.md"
      - "PORTFOLIO_STATUS.md"
      - ".github/workflows/gca-runtime-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gca-runtime-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile boundary sources
        run: >-
          python -m py_compile
          apps/gca-service/runtime_boundary.py
          apps/gca-service/api_server.py
          apps/gca-service/tests/test_runtime_boundary.py

      - name: Run default-deny contract tests
        run: python -m unittest discover -s apps/gca-service/tests -p 'test_runtime_boundary.py' -v
